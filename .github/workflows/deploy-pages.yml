name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh the profile/repository snapshot once an hour.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch GitHub profile and repository data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/pyatrick666" \
            --output /tmp/github-user.json

          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/pyatrick666/repos?sort=pushed&per_page=100" \
            --output /tmp/github-repos.json

          mkdir -p public

          jq -n \
            --slurpfile user /tmp/github-user.json \
            --slurpfile repos /tmp/github-repos.json \
            '{
              user: ($user[0] | {
                login,
                avatar_url,
                public_repos,
                followers
              }),
              repos: (
                $repos[0]
                | map(select(
                    .name != "Professional-Portfolio"
                    and .name != "ePortfolio"
                    and .name != "RaspberryPi-PICO"
                    and .name != "CarRentalApp"
                  ))
                | sort_by(-(.stargazers_count // 0))
                | .[:6]
                | map({
                    id,
                    name,
                    description: (.description // ""),
                    language: (.language // ""),
                    watchers: (.watchers_count // 0),
                    forks: (.forks_count // .forks // 0),
                    stargazers_count: (.stargazers_count // 0),
                    html_url,
                    homepage: (.homepage // "")
                  })
              )
            }
            | if .user.login == "pyatrick666" and (.repos | type == "array")
              then .
              else error("GitHub profile data did not match the expected schema")
              end' > public/github-data.json

          jq -e '.user.login == "pyatrick666" and (.repos | length <= 6)' public/github-data.json

      - name: Prepare local resume asset
        run: cp components/resume.pdf public/resume.pdf

      - name: Generate iOS bookmark icon
        run: npx --yes sharp-cli -i public/favicon.svg -o public/apple-touch-icon.png resize 180 180

      - name: Build static Next.js site
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
